name: Build Swadistha Windows App

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install ImageMagick
        shell: powershell
        run: choco install imagemagick.app -y --no-progress

      - name: Create Windows app icon
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          magick assets/swadistha-app-icon.jpg -define icon:auto-resize=256,128,64,48,32,16 build/icon.ico

      - name: Install dependencies
        run: npm install

      - name: Verify Electron version
        run: npx electron --version

      - name: Build Windows installer and portable app
        run: npm run build

      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: Swadistha-POS-Windows
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error
