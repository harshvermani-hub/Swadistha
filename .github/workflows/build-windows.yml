name: Build Swadistha Windows App

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair UTF-8 source encoding
        shell: powershell
        run: |
          $p = 'index.html'
          $s = Get-Content $p -Raw
          if ($s -match '[âÃð]') {
            $cp1252 = [System.Text.Encoding]::GetEncoding(1252)
            $utf8 = [System.Text.Encoding]::UTF8
            $fixed = $utf8.GetString($cp1252.GetBytes($s))
            [System.IO.File]::WriteAllText((Resolve-Path $p), $fixed, (New-Object System.Text.UTF8Encoding($false)))
          }

      - name: Commit encoding repair
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if (-not (git diff --cached --quiet)) {
            git commit -m "Repair UTF-8 encoding in app source"
            git push origin HEAD:main
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ImageMagick
        shell: powershell
        run: choco install imagemagick.app -y --no-progress

      - name: Create Windows app icon
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          magick assets/swadistha-app-icon.jpg -resize 256x256 build/icon.ico

      - name: Install dependencies
        run: npm install

      - name: Verify Electron version
        run: npx electron --version

      - name: Build Windows installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Swadistha-POS-Windows-8.1
          path: dist/*.exe
          if-no-files-found: error
