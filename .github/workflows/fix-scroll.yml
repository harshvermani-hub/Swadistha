name: Fix Billing Scroll

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-scroll:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix desktop page scrolling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          pattern = r'/\* ===== ONE-SCREEN BILLING LAYOUT ===== \*/.*?\n}\n</style>'
          replacement = '''/* ===== BILLING SCROLL FIX ===== */
          @media (min-width: 1001px) {
            html, body {
              min-height: 100%;
              height: auto;
              overflow-y: auto;
              overflow-x: hidden;
            }

            .app {
              min-height: 100vh;
              height: auto;
            }

            .body {
              min-height: calc(100vh - 64px);
              height: auto;
            }

            .main {
              min-height: calc(100vh - 64px);
              height: auto;
              overflow: visible;
              padding: 10px;
            }

            #billing {
              min-height: calc(100vh - 84px);
              height: auto;
              overflow: visible;
            }

            #billing .billing-grid {
              align-items: start;
            }

            #billing .billing-grid > .panel {
              overflow: visible;
            }

            #billing .cart {
              max-height: 360px;
              overflow-y: auto;
            }
          }
        </style>'''

          ns, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not find the old one-screen billing CSS block')
          p.write_text(ns, encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix billing page scrolling'
          git push
